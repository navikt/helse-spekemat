apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spekemat
  namespace: tbd
  labels:
    team: tbd
spec:
  image: {{image}}
  strategy:
    type: RollingUpdate
  replicas:
    min: 2
    max: 12
  liveness:
    path: /isalive
    initialDelay: 5
  readiness:
    path: /isready
    initialDelay: 5
    periodSeconds: 1
  resources:
    limits:
      memory: 1024Mi
  prometheus:
    path: /metrics
    enabled: true
  azure:
    application:
      enabled: true
      tenant: {{ tenant }}
  accessPolicy:
    inbound:
      rules:
        - application: spekemat-slakter
        - application: spleis-api
        - application: spoken
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: {{databaseTier}}
        diskAutoresize: true
        databases:
          - name: spekemat
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "{{pgAudit}}"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  ingresses:
    - {{ingress}}
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki

